name: Build Firmware

on:
  push:
    branches: [ main, master, develop ]
    tags:     [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build PipiCube UF2
    runs-on: ubuntu-22.04

    env:
      PICO_SDK_VERSION:   "1.5.1"
      PICO_SDK_PATH:      "${{ github.workspace }}/pico-sdk"
      FPRIME_VERSION:     "v4.2.2"
      FPRIME_PATH:        "${{ github.workspace }}/fprime"

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history so tags resolve for release notes

      # ── 2. Toolchain ─────────────────────────────────────────────────────────
      # pico-sdk 1.5.1 was designed for ARM GCC 12.x. ARM GCC 13.x introduced
      # a nosys.specs change that causes a fatal "attempt to rename spec" error
      # when pico-sdk passes -specs=nosys.specs to link boot_stage2. Use the
      # official Arm GNU Toolchain 12.3.Rel1 tarball which does not have this
      # bug and is the version pico-sdk 1.5.1 was tested against.
      - name: Install ARM cross-compiler (Arm GNU Toolchain 12.3.Rel1)
        run: |
          curl -fL "https://developer.arm.com/-/media/Files/downloads/gnu/12.3.rel1/binrel/arm-gnu-toolchain-12.3.rel1-x86_64-arm-none-eabi.tar.xz" \
            -o /tmp/arm-toolchain.tar.xz
          sudo mkdir -p /opt/arm-toolchain
          sudo tar -xf /tmp/arm-toolchain.tar.xz -C /opt/arm-toolchain --strip-components=1
          echo "/opt/arm-toolchain/bin" >> "$GITHUB_PATH"
          /opt/arm-toolchain/bin/arm-none-eabi-gcc --version

      # ── 3. Python / F' tools ─────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install F Prime tools
        run: pip install -r requirements.txt

      # ── 4. F Prime framework (cached by version tag) ─────────────────────────
      - name: Cache fprime
        id: cache-fprime
        uses: actions/cache@v4
        with:
          path: ${{ env.FPRIME_PATH }}
          key: fprime-${{ env.FPRIME_VERSION }}

      - name: Clone fprime ${{ env.FPRIME_VERSION }}
        if: steps.cache-fprime.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 \
            --branch "$FPRIME_VERSION" \
            https://github.com/nasa/fprime.git \
            "$FPRIME_PATH"
          cd "$FPRIME_PATH"
          git submodule update --init --depth 1

      - name: Install fprime framework requirements (fpp-tools)
        run: pip install -r "$FPRIME_PATH/requirements.txt"

      # ── 5. Pico SDK (cached by version) ──────────────────────────────────────
      - name: Cache pico-sdk
        id: cache-pico-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.PICO_SDK_PATH }}
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}

      - name: Clone pico-sdk ${{ env.PICO_SDK_VERSION }}
        if: steps.cache-pico-sdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 \
            --branch "$PICO_SDK_VERSION" \
            https://github.com/raspberrypi/pico-sdk.git \
            "$PICO_SDK_PATH"
          cd "$PICO_SDK_PATH"
          git submodule update --init --depth 1

      # ── 6. Configure ─────────────────────────────────────────────────────────
      - name: CMake configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DPICO_SDK_PATH="$PICO_SDK_PATH" \
            -DFPRIME_FRAMEWORK_PATH="$FPRIME_PATH" \
            -DFPRIME_ENABLE_TEXT_LOGGERS=OFF

      # ── 7. Build ──────────────────────────────────────────────────────────────
      - name: Build firmware
        run: cmake --build build --parallel $(nproc)

      # ── 8. Generate UF2 ──────────────────────────────────────────────────────
      # pico_add_extra_outputs may not fire in the F' cmake deployment structure;
      # convert explicitly using the elf2uf2 tool that pico-sdk builds.
      - name: Generate UF2
        run: |
          # Locate ELF (pico-sdk may or may not append .elf suffix)
          ELF=$(find build/bin/pico_arm_gcc -maxdepth 1 -type f \
                  \( -name "pipicube" -o -name "pipicube.elf" \) | head -1)
          if [ -z "$ELF" ]; then
            echo "ERROR: ELF not found in build/bin/pico_arm_gcc/" && exit 1
          fi
          echo "ELF: $ELF"

          # Find elf2uf2 built by pico-sdk, or build it from source
          ELF2UF2=$(find build -name "elf2uf2" -type f 2>/dev/null | head -1)
          if [ -z "$ELF2UF2" ]; then
            echo "elf2uf2 not in cmake build tree; building from pico-sdk source"
            cmake -S "$PICO_SDK_PATH/tools/elf2uf2" -B /tmp/elf2uf2-build \
                  -DCMAKE_BUILD_TYPE=Release
            cmake --build /tmp/elf2uf2-build
            ELF2UF2=/tmp/elf2uf2-build/elf2uf2
          fi
          echo "elf2uf2: $ELF2UF2"

          "$ELF2UF2" "$ELF" build/bin/pico_arm_gcc/pipicube.uf2
          ls -lh build/bin/pico_arm_gcc/pipicube.uf2
          # Ensure a .elf name exists for the upload step
          [ -f build/bin/pico_arm_gcc/pipicube.elf ] || \
              cp "$ELF" build/bin/pico_arm_gcc/pipicube.elf

      # ── 9. Verify outputs ────────────────────────────────────────────────────
      - name: Verify build artefacts
        run: |
          ls -lh build/bin/pico_arm_gcc/pipicube.uf2
          ls -lh build/bin/pico_arm_gcc/pipicube.elf
          arm-none-eabi-size build/bin/pico_arm_gcc/pipicube.elf

      # ── 10. Upload UF2 (every build) ─────────────────────────────────────────
      - name: Upload UF2 artefact
        uses: actions/upload-artifact@v4
        with:
          name: pipicube-firmware-${{ github.sha }}
          path: |
            build/bin/pico_arm_gcc/pipicube.uf2
            build/bin/pico_arm_gcc/pipicube.elf
          if-no-files-found: error
          retention-days: 90

      # ── 11. GitHub Release (tag builds only) ─────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "PipiCube ${{ github.ref_name }}"
          body: |
            ## PipiCube Firmware ${{ github.ref_name }}

            ### Flash instructions
            1. Hold the **BOOTSEL** button on the Raspberry Pi Pico and plug in USB.
            2. The board mounts as a drive called **RPI-RP2**.
            3. Drag and drop `pipicube.uf2` onto that drive — the Pico reboots automatically.

            ### Hardware
            | Peripheral | Interface | Pins |
            |---|---|---|
            | Seeed Pico-UPS-A (IP5306) | I2C1, 100 kHz | GP6 SDA · GP7 SCL |
            | NEO-6M V2 GPS | UART1, 9600 baud | GP4 TX · GP5 RX |
            | LoRa radio (RYLR896) | UART0, 115200 baud | GP0 TX · GP1 RX |

            ### Build info
            | | |
            |---|---|
            | Commit | `${{ github.sha }}` |
            | Toolchain | arm-none-eabi-gcc |
            | pico-sdk | ${{ env.PICO_SDK_VERSION }} |
            | fprime | ${{ env.FPRIME_VERSION }} |
          files: |
            build/bin/pico_arm_gcc/pipicube.uf2
            build/bin/pico_arm_gcc/pipicube.elf
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
